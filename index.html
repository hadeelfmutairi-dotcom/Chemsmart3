const MOLS={
 h2o:{n:"الماء H₂O",a:[["O",0,0,0],["H",0.76,0.59,0],["H",-0.76,0.59,0]],b:[[0,1],[0,2]]},
 h3o:{n:"أيون الهيدرونيوم H₃O⁺",a:[["O",0,0,0.1],["H",0.94,0,-0.25],["H",-0.47,0.81,-0.25],["H",-0.47,-0.81,-0.25]],b:[[0,1],[0,2],[0,3]]},
 nh3:{n:"الأمونيا NH₃",a:[["N",0,0,0.12],["H",0.94,0,-0.25],["H",-0.47,0.81,-0.25],["H",-0.47,-0.81,-0.25]],b:[[0,1],[0,2],[0,3]]},
 hcl:{n:"كلوريد الهيدروجين HCl",a:[["Cl",0,0,0],["H",1.27,0,0]],b:[[0,1]]},
 acoh:{n:"حمض الإيثانويك CH₃COOH",a:[["C",-0.75,0,0],["C",0.75,0,0],["O",1.35,1.05,0],["O",1.4,-1.1,0],["H",2.33,-0.95,0],["H",-1.12,1.02,0],["H",-1.12,-0.5,0.88],["H",-1.12,-0.5,-0.88]],b:[[0,1],[1,2],[1,3],[3,4],[0,5],[0,6],[0,7]],dbl:[[1,2]]},
 nacl:{n:"شبكة كلوريد الصوديوم (جزء)",a:(()=>{const r=[];for(let x=0;x<3;x++)for(let y=0;y<3;y++)for(let z=0;z<3;z++)r.push([(x+y+z)%2?"Na":"Cl",(x-1)*1.4,(y-1)*1.4,(z-1)*1.4]);return r;})(),b:(()=>{const r=[];const idx=(x,y,z)=>x*9+y*3+z;for(let x=0;x<3;x++)for(let y=0;y<3;y++)for(let z=0;z<3;z++){if(x<2)r.push([idx(x,y,z),idx(x+1,y,z)]);if(y<2)r.push([idx(x,y,z),idx(x,y+1,z)]);if(z<2)r.push([idx(x,y,z),idx(x,y,z+1)]);}return r;})()}};
const ATOM={O:["#e74c3c",0.42],H:["#f4f6f6",0.26],N:["#3d7eb9",0.4],C:["#3b4a52",0.4],Cl:["#07a869",0.5],Na:["#7258a4",0.36]};
function molViewer(canvas,key,opts={}){ const ctx=canvas.getContext("2d"); let ang=opts.start||0.6, tilt=0.35, drag=null, raf, alive=true; const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
 const fit=()=>{ const r=canvas.getBoundingClientRect(); const d=devicePixelRatio||1; canvas.width=Math.max(10,r.width*d); canvas.height=Math.max(10,r.height*d); };
 const draw=()=>{ if(!canvas.isConnected){ alive=false; return; } const m=MOLS[key]; const W=canvas.width,H=canvas.height; ctx.clearRect(0,0,W,H); const s=Math.min(W,H)/(key==="nacl"?5.2:3.6);
  const P=m.a.map(([e,x,y,z])=>{ const X=x*Math.cos(ang)+z*Math.sin(ang); let Z=-x*Math.sin(ang)+z*Math.cos(ang); const Y=y*Math.cos(tilt)-Z*Math.sin(tilt); Z=y*Math.sin(tilt)+Z*Math.cos(tilt); return {e,x:W/2+X*s,y:H/2+Y*s,z:Z}; });
  ctx.lineCap="round"; m.b.forEach(([i,j])=>{ ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue("--muted")||"#888"; ctx.lineWidth=s*0.12; ctx.beginPath(); ctx.moveTo(P[i].x,P[i].y); ctx.lineTo(P[j].x,P[j].y); ctx.stroke(); });
  [...P].sort((a,b)=>a.z-b.z).forEach(p=>{ const [c,r]=ATOM[p.e]; const R=r*s*(1+p.z*0.06); const g=ctx.createRadialGradient(p.x-R*.35,p.y-R*.35,R*.1,p.x,p.y,R); g.addColorStop(0,"#ffffff"); g.addColorStop(.25,c); g.addColorStop(1,shade(c)); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(p.x,p.y,R,0,7); ctx.fill(); if(opts.labels!==false&&key!=="nacl"){ ctx.fillStyle=p.e==="H"?"#15445a":"#fff"; ctx.font=`700 ${Math.max(10,R*0.7)}px Cairo, sans-serif`; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(p.e,p.x,p.y); } }); };
 function shade(h){ const n=parseInt(h.slice(1),16); return "rgb("+[(n>>16)&255,(n>>8)&255,n&255].map(v=>Math.round(v*0.55)).join(",")+")"; }
 const loop=()=>{ if(!alive) return; if(!drag&&!reduce) ang+=0.008; draw(); raf=requestAnimationFrame(loop); };
 canvas.addEventListener("pointerdown",e=>{ drag={x:e.clientX,y:e.clientY,a:ang,t:tilt}; canvas.setPointerCapture(e.pointerId); });
 canvas.addEventListener("pointermove",e=>{ if(!drag) return; ang=drag.a+(e.clientX-drag.x)*0.01; tilt=Math.max(-1.2,Math.min(1.2,drag.t+(e.clientY-drag.y)*0.01)); if(reduce) draw(); });
 canvas.addEventListener("pointerup",()=>drag=null);
 canvas.tabIndex=0; canvas.addEventListener("keydown",e=>{ if(e.key==="ArrowLeft") ang-=0.15; if(e.key==="ArrowRight") ang+=0.15; if(e.key==="ArrowUp") tilt-=0.1; if(e.key==="ArrowDown") tilt+=0.1; draw(); });
 fit(); new ResizeObserver(()=>{fit();draw();}).observe(canvas); loop();
 return {set(k){key=k;draw();}}; }

function parseNamesFromRows(rows){ rows=rows.map(r=>(r||[]).map(c=>String(c??"").replace(/\s+/g," ").trim()));
 let col=-1,start=0; for(let i=0;i<Math.min(rows.length,15)&&col<0;i++){ const j=rows[i].findIndex(c=>/(^|\s)(ال)?اسم/.test(c)&&!/(المدرسة|المعلم|الأب|ولي|المادة)/.test(c)); if(j>=0){ col=j; start=i+1; } }
 if(col<0){ const n=Math.max(0,...rows.map(r=>r.length)); let best=-1,score=-1; for(let j=0;j<n;j++){ const sc=rows.filter(r=>/[\u0600-\u06FF]{2,}\s+[\u0600-\u06FF]{2,}/.test(r[j]||"")&&!/\d/.test(r[j]||"")).length; if(sc>score){score=sc;best=j;} } col=best; }
 return rows.slice(start).map(r=>r[col]||"").filter(x=>x.length>=2&&x.length<=60&&!/\d{3,}/.test(x)&&/[\u0600-\u06FFa-zA-Z]/.test(x)); }
const PDFJS={lib:"https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs",worker:"https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs"};
const NAME_STOP=new Set("اسم الاسم رقم الهوية هوية السجل المدني الصف الفصل الشعبة المدرسة مدرسة وزارة التعليم إدارة ادارة تقرير كشف قائمة بيانات المملكة العربية السعودية الجنسية سعودي سعودية صفحة من الإجمالي المجموع العام الدراسي المرحلة الثانوية الطلاب الطالبات الطالب الطالبة الثالث الثاني الأول الاول ثانوي م التاريخ الحالة منتظم منتظمة الجوال ولي الأمر النوع ذكر أنثى المسار مسار علمي العلمي".split(" "));
const NAME_HEADER=new Set("وزارة إدارة ادارة بإدارة بادارة محافظة بمحافظة منطقة بمنطقة كشف تقرير قائمة المملكة صفحة العام الدراسي الفصل الصف المرحلة مكتب".split(" "));
function namesFromLines(lines){ const out=[];
 for(const raw of lines){ const line=raw.normalize("NFKC").replace(/ـ/g,"").replace(/[^؀-ۿa-zA-Z\s]/g," ").replace(/\s+/g," ").trim(); if(!line) continue;
  const toks=line.split(" "); if(toks.some(t=>NAME_HEADER.has(t))) continue; let runs=[],cur=[]; for(const t of toks){ const ar=/^[؀-ۿ]+$/.test(t); if(ar&&!NAME_STOP.has(t)) cur.push(t); else { if(cur.length) runs.push(cur); cur=[]; } } if(cur.length) runs.push(cur);
  const best=runs.filter(r=>r.length>=2&&r.length<=7).sort((a,b)=>b.length-a.length)[0]; if(best){ const n=best.join(" "); if(n.length>=5&&n.length<=60) out.push(n); } }
 return [...new Set(out)]; }
async function pdfLines(f){ const lib=await import(PDFJS.lib); lib.GlobalWorkerOptions.workerSrc=PDFJS.worker;
 const doc=await lib.getDocument({data:new Uint8Array(await f.arrayBuffer()),isEvalSupported:false}).promise; const lines=[];
 for(let i=1;i<=Math.min(doc.numPages,20);i++){ const pg=await doc.getPage(i); const tc=await pg.getTextContent(); const rows={};
  tc.items.forEach(it=>{ if(!it.str||!it.str.trim()) return; const y=Math.round(it.transform[5]/4); (rows[y]=rows[y]||[]).push(it); });
  Object.keys(rows).map(Number).sort((a,b)=>b-a).forEach(k=>{ const its=rows[k].sort((a,b)=>b.transform[4]-a.transform[4]); let txt="",prev=null;
   its.forEach(it=>{ const fs=Math.abs(it.transform[0])||10; if(prev){ const gap=prev.transform[4]-(it.transform[4]+(it.width||0)); txt+=gap>fs*0.15?" ":""; } txt+=it.str; prev=it; }); lines.push(txt); }); }
 return lines; }
async function namesFromFile(f){ if(/\.pdf$/i.test(f.name)||f.type==="application/pdf"){ let lines; try{ lines=await pdfLines(f); }catch(e){ throw new Error("تعذر فتح ملف PDF. جرّبي ملف Excel من نور، أو انسخي الأسماء والصقيها."); } if(!lines.join("").trim()) throw new Error("ملف PDF هذا صورة ممسوحة لا يحتوي نصًا. استخدمي ملف Excel من نور، أو انسخي الأسماء والصقيها."); return namesFromLines(lines); }
 if(/\.csv$/i.test(f.name)||!window.XLSX){ const t=await f.text(); return parseNamesFromRows(t.split(/\r?\n/).map(l=>l.split(/[,;\t]/))); }
 const wb=XLSX.read(await f.arrayBuffer(),{type:"array"}); const ws=wb.Sheets[wb.SheetNames[0]]; return parseNamesFromRows(XLSX.utils.sheet_to_json(ws,{header:1,raw:false})); }

 <nav class="stations" aria-label="محطات الدرس">${STATIONS.map(([k,t],i)=>`<button class="${st[k]?"done":""} ${k===cur?"cur":""}" data-st="${k}" aria-current="${k===cur?"step":"false"}"><span class="n">${i+1}</span>${t}</button>`).join("")}</nav>
 <section id="stbody" class="stack fade"></section>
 <div class="spread"><button class="btn ghost" id="st-prev">المحطة السابقة</button><button class="btn" id="st-next">المحطة التالية</button></div>`;
 $$("[data-st]").forEach(b=>b.onclick=()=>go(b.dataset.st));
 const idx=STATIONS.findIndex(([k])=>k===cur); $("#st-prev").disabled=idx===0; $("#st-next").disabled=idx===6;
 $("#st-prev").onclick=()=>go(STATIONS[idx-1][0]); $("#st-next").onclick=()=>go(STATIONS[idx+1][0]);
 function go(s){ location.hash=`#lesson-${l.id}-${s}`; }

const STATION={
 discover(l,el){ el.innerHTML=`<div class="card"><h2>أكتشف</h2><p class="muted">سؤال تشخيصي قصير. لا يُحتسب في الدرجة، لكنه يساعدنا على معرفة نقطة انطلاقك.</p><div id="dq"></div></div>`;
  mountQuiz($("#dq"),[{id:"d"+l.id,l:l.id,c:"diag",t:"mcq",s:l.discover.stem,opts:l.discover.opts,a:l.discover.a,ex:"سنتعمق في تفسير ذلك في محطة «أفهم»."}],{kind:"discover",ref:l.id,lesson:null,submitLabel:"أرسل إجابتي",onDone:(att)=>{ Store.setStation(l.id,"discover",{pct:att.pct}); renderStationsBar(l); }}); },
 understand(l,el){ el.innerHTML=`<div class="grid g2" style="align-items:start"><div class="stack">${l.sections.map((s,i)=>`<article class="card"><h3>${i+1}. ${esc(s.h)}</h3><p>${fmt(s.p)}</p></article>`).join("")}
  ${l.worked?`<div class="card"><h3>أمثلة محلولة</h3>${l.worked.map((w,i)=>`<details ${i===0?"open":""}><summary><b>مثال ${i+1}:</b> ${esc(w.q)}</summary><div class="eq" style="text-align:right;direction:rtl;font-family:var(--font)">${w.s.map(esc).join("<br>")}</div></details>`).join("")}</div>`:""}</div>
  <aside class="stack"><div class="panel stack"><h3>نواتج التعلم <span class="tag orig">من الكتاب</span></h3><ul style="margin:0;padding-inline-start:1.1rem">${l.obj.map(o=>`<li>${esc(o)}</li>`).join("")}</ul></div>
  ${l.formulas.length?`<div class="card"><h3>القوانين والعلاقات</h3>${l.formulas.map(f=>`<div class="eq">${fmt(f)}</div>`).join("")}</div>`:""}
  <div class="card"><h3>المفردات <span class="tag orig">من الكتاب</span></h3><div class="chips">${l.vocab.map(v=>{ const g=GLOSSARY.find(x=>x[0]===v||v.startsWith(x[0])); return `<span class="tag" ${g?`title="${esc(g[1])}"`:""}>${esc(v)}</span>`; }).join("")}</div></div>
  ${l.id==="2-3"||l.id==="2-1"||l.id==="2-2"?`<div class="card"><h3>نموذج ثلاثي الأبعاد</h3><canvas id="u-mol" style="width:100%;height:220px" aria-label="نموذج ثلاثي الأبعاد لأيون الهيدرونيوم"></canvas><p class="small muted">اسحب لتدوير النموذج. أيون الهيدرونيوم يتكوّن عندما يستقبل جزيء الماء أيون هيدروجين.</p></div>`:""}
  <div class="notice small">الشرح أعلاه صياغة مبسطة من إعداد المنصة متوافقة مع الكتاب. ارجع إلى الكتاب ص ${l.page} للأشكال والجداول الأصلية.</div>
  <button class="btn" id="u-done">أنهيت القراءة</button></aside></div>`;
  if($("#u-mol")) molViewer($("#u-mol"),"h3o");
  $("#u-done").onclick=()=>{ Store.setStation(l.id,"understand",{read:true}); toast("سُجّلت محطة «أفهم»."); location.hash=`#lesson-${l.id}-watch`; }; },
 watch(l,el){ const lab=LABS[l.lab]; const tasks=WATCH_TASKS[l.lab]||["حرّك المتغيرات ولاحظ تغير القراءات."];
  el.innerHTML=`<div class="card"><h2>أشاهد: ${lab.title}</h2><p class="muted">نفّذ مهام المشاهدة الموجهة. ضع علامة على كل مهمة بعد ملاحظتها.</p><div class="stack" id="w-tasks">${tasks.map((t,i)=>`<label class="opt"><input type="checkbox" data-w="${i}"> <span>${fmt(esc(t))}</span></label>`).join("")}</div></div><div id="w-lab"></div><div class="assume"><b>افتراضات النموذج:</b> ${esc(lab.assume)}</div>`;
  const ctx={}; lab.init($("#w-lab"),ctx,fmt);
  $$("[data-w]").forEach(c=>c.onchange=()=>{ const n=$$("[data-w]:checked").length; if(n===tasks.length){ Store.setStation(l.id,"watch",{tasks:n}); renderStationsBar(l); toast("أحسنت، اكتملت محطة «أشاهد»."); } }); },
 try(l,el){ const lab=LABS[l.lab]; el.innerHTML=`<div class="card"><h2>أجرب</h2><p class="muted">صُغ فرضيتك أولًا، ثم استخدم المختبر، وسجّل ملاحظاتك واستنتاجك. يُحفظ عملك تقرير مختبر في ملف إنجازك.</p></div><div id="t-lab"></div>${labReportForm(l.lab)}`;
  const ctx={}; lab.init($("#t-lab"),ctx,fmt); wireLabReport(l.lab,ctx,()=>{ Store.setStation(l.id,"try",{report:true}); renderStationsBar(l); }); },
 apply(l,el){ const qs=qFor(l.id); const cust=Store.customQForStudent().filter(q=>q.l===l.id);
  el.innerHTML=`<div class="card"><h2>أطبق</h2><p class="muted">أسئلة ومسائل متنوعة مع تغذية راجعة فورية وتلميحات. تُحسب التلميحات المستخدمة في سجلك.</p></div><div id="aq"></div>`;
  mountQuiz($("#aq"),[...qs,...cust],{kind:"apply",ref:l.id,lesson:l.id,hints:true,onDone:(att)=>{ Store.setStation(l.id,"apply",{pct:att.pct}); renderStationsBar(l); }}); },
 innovate(l,el){ const prev=Store.stations(l.id).innovate; el.innerHTML=`<div class="card stack"><h2>أبتكر <span class="tag new">نشاط مبتكر</span></h2><p>${fmt(esc(l.innovate))}</p><label class="f" for="in-t">ناتجك (تفسير، نموذج، خطة، أو حل)<textarea id="in-t" rows="7">${esc(prev?.text||"")}</textarea></label><label class="f" for="in-l">رابط لعمل خارجي (اختياري)<input type="url" id="in-l" dir="ltr" value="${esc(prev?.link||"")}"></label><div class="row"><button class="btn" id="in-s">احفظ ناتجي</button><a class="btn ghost" href="#incubator">حوّله إلى مشروع في حاضنة الابتكار</a></div><p class="small muted">يراجع معلمك ناتجك ويقيّمه. لا تمنح المنصة درجة آلية للمهام المفتوحة.</p></div>`;
  $("#in-s").onclick=()=>{ const t=$("#in-t").value.trim(); if(t.length<30){ toast("اكتب ناتجًا لا يقل عن 30 حرفًا."); return; } Store.setStation(l.id,"innovate",{text:t,link:$("#in-l").value.trim()}); renderStationsBar(l); toast("حُفظ ناتجك."); }; },
 master(l,el){ const pool=qFor(l.id); const qs=shuffle(pool).slice(0,Math.min(5,pool.length));
  el.innerHTML=`<div class="card"><h2>أتقن</h2><p class="muted">تقويم ختامي قصير (${qs.length} أسئلة) يحدد مستوى إتقانك ومسارك التالي. يُحسب الإتقان من سجل محاولاتك مع إعطاء وزن أكبر للمحاولات الأحدث.</p></div><div id="mq"></div><div id="mpath"></div>`;
  mountQuiz($("#mq"),qs,{kind:"master",ref:l.id,lesson:l.id,onDone:(att)=>{ Store.setStation(l.id,"master",{pct:att.pct}); renderStationsBar(l); $("#mpath").innerHTML=pathPanel(l.id,Store.me()?null:Math.round(att.pct)); wirePath(l.id); }}); }
};

function pathPanel(lid,fallback){ const m=myMastery(lid)??fallback; const s=classSettings(); const p=Mastery.path(m,s); if(!p) return "";
 const hist=Mastery.history(myAtt(),lid);
 return `<div class="panel stack"><div class="spread"><h3>مسارك التالي: ${Mastery.pathName[p]}</h3><span class="tag ${p==="enrich"?"ok":p==="practice"?"warn":"bad"}">الإتقان ${m}%</span></div><p class="small muted">الحدود المستخدمة: أقل من ${s.remedial}% علاجي، ومن ${s.remedial}% إلى أقل من ${s.mastery}% تدريبي، و${s.mastery}% فأكثر إثرائي. حدود تصميمية يعدلها المعلم، وليست معايير رسمية.</p>${lineChart(hist.map((h,i)=>({v:h.pct,label:"محاولة "+(i+1)})),{label:"تطور النتائج"})}<div id="path-act"></div><button class="btn" id="path-go">ابدأ ${Mastery.pathName[p]}</button></div>`; }
function wirePath(lid){ const b=$("#path-go"); if(!b) return; b.onclick=()=>{ location.hash="#paths-"+lid; }; }

/* ---------- Lab report ---------- */
function labReportForm(key){ const lab=LABS[key]; return `<form class="card stack" id="lr" novalidate><h3>تقرير المختبر الرقمي</h3><div class="grid g2"><label class="f" for="lr-g">الهدف<textarea id="lr-g" rows="2">${esc(lab.goal)}</textarea></label><label class="f" for="lr-h">الفرضية<textarea id="lr-h" rows="2" placeholder="إذا ... فإن ... لأن ..."></textarea></label></div>
 <div class="grid g3"><label class="f" for="lr-i">المتغير المستقل<input type="text" id="lr-i" value="${esc(lab.vars.ind)}"></label><label class="f" for="lr-d">المتغير التابع<input type="text" id="lr-d" value="${esc(lab.vars.dep)}"></label><label class="f" for="lr-c">الثوابت<input type="text" id="lr-c" value="${esc(lab.vars.ctrl)}"></label></div>
 <label class="f" for="lr-o">الملاحظات<textarea id="lr-o" rows="3"></textarea></label><div class="stack"><div class="spread"><b>النتائج (قراءات المختبر)</b><button class="btn sm ghost" type="button" id="lr-add">أدرج القراءات الحالية</button></div><div id="lr-r" class="tablewrap"><div class="empty small">لم تُدرج قراءات بعد.</div></div></div>
 <label class="f" for="lr-x">الاستنتاج<textarea id="lr-x" rows="3"></textarea></label><button class="btn" type="submit">احفظ التقرير</button><div id="lr-e"></div></form>`; }
function wireLabReport(key,ctx,after){ const rows=[]; const tbl=()=>{ if(!rows.length) return; const keys=[...new Set(rows.flatMap(r=>Object.keys(r)))]; $("#lr-r").innerHTML=`<table class="t small"><thead><tr><th>#</th>${keys.map(k=>`<th>${esc(k)}</th>`).join("")}</tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td>${keys.map(k=>`<td dir="auto">${esc(typeof r[k]==="object"?JSON.stringify(r[k]):r[k]??"")}</td>`).join("")}</tr>`).join("")}</tbody></table>`; };
 $("#lr-add").onclick=()=>{ if(!ctx.state){ toast("استخدم المختبر أولًا."); return; } rows.push({...ctx.state}); tbl(); toast("أُدرجت القراءة "+rows.length); };
 $("#lr").onsubmit=e=>{ e.preventDefault(); const h=$("#lr-h").value.trim(), x=$("#lr-x").value.trim(); if(!h||!x||!rows.length){ $("#lr-e").innerHTML=`<div class="fb bad">أكمل الفرضية والاستنتاج، وأدرج قراءة واحدة على الأقل.</div>`; return; }
  Store.saveLabReport({lab:key,lesson:LABS[key].lesson,goal:$("#lr-g").value,hypothesis:h,vars:{ind:$("#lr-i").value,dep:$("#lr-d").value,ctrl:$("#lr-c").value},observations:$("#lr-o").value,results:rows,conclusion:x,score:ctx.score||null});
  $("#lr-e").innerHTML=`<div class="fb ok">حُفظ التقرير${Store.me()?" في ملف إنجازك":"، لكنك زائر فلن يُحفظ بعد إغلاق الصفحة"}.</div>`; after&&after(); }; }

 <div class="card stack" id="privacy"><h2>سياسة الخصوصية</h2><ul class="small"><li><b>الحد الأدنى من البيانات:</b> اسم معروض، اسم مستخدم، كلمة مرور (تُحفظ مُجزّأة)، اسم المدرسة للمعلم فقط. لا نطلب الهوية الوطنية أو رقم الجوال أو تاريخ الميلاد.</li><li><b>القاصرون:</b> يتطلب حساب الطالب تأكيد موافقة ولي الأمر أو المدرسة. يُفضّل أن تنشئ المدرسة حسابات الطلاب عبر المعلم.</li><li><b>العزل:</b> لا يطّلع المعلم إلا على طلاب فصوله، ولا تعرض الإدارة إلا مؤشرات إجمالية. لا تُعرض أسماء الطلاب في أي قائمة عامة.</li><li><b>المشروعات والملفات:</b> خاصة بالطالب ومعلمه، ولا تُنشر للعامة تلقائيًا.</li><li><b>الذكاء الاصطناعي:</b> المساعد الأساسي يعمل محليًا. المساعد التوليدي معطل افتراضيًا، وإذا فُعّل فلا يُرسل إلا نص السؤال ومقتطف الدرس بعد موافقة المستخدم.</li><li><b>الحذف والتصدير:</b> يستطيع كل مستخدم تصدير بياناته وحذف حسابه نهائيًا من صفحة «حسابي».</li><li><b>الأنظمة:</b> صُممت المنصة لمراعاة نظام حماية البيانات الشخصية في المملكة العربية السعودية ولوائحه. عند النشر الرسمي يلزم تعيين مسؤول حماية بيانات واستضافة البيانات وفق متطلبات الجهة المشغلة.</li></ul></div>
 <div class="card stack"><h2>التشغيل والنشر</h2><p class="small">النسخة الحالية تعمل كاملة داخل المتصفح وتحفظ البيانات محليًا، وهي مناسبة للعرض والتجربة داخل فصل واحد على جهاز واحد. للتشغيل الفعلي متعدد المدارس تُرفق حزمة المشروع مع مخطط قاعدة بيانات (PostgreSQL / Supabase) يتضمن سياسات أمان على مستوى الصفوف تطبق العزل نفسه على الخادم.</p><p class="small"><b>التكاليف المتوقعة:</b> يمكن البدء بخطط مجانية (استضافة ثابتة + قاعدة بيانات بخطة مجانية) لعدد محدود من المستخدمين؛ التوسع على مستوى المملكة يتطلب خطة مدفوعة واستضافة بيانات متوافقة مع الأنظمة المحلية، وتُقدّر حسب أعداد المستخدمين.</p></div>

 $$("#ifile textarea").forEach(t=>t.oninput=()=>{ saved[t.id.slice(3)]=t.value; try{ localStorage.setItem("chemsmart3.initiative",JSON.stringify(saved)); }catch(e){} });
 $("#ip").onclick=()=>exportPDF("chemsmart-initiative-profile.pdf",$("#ifile"));
 $("#sv-b").onclick=()=>{ Store.saveSurvey({role:$("#sv-r").value,score:+$("#sv-s").value,comment:$("#sv-c").value}); toast("شكرًا لمشاركتك."); }; };

PAGES.notfound=()=>{ view().innerHTML=`<div class="empty stack" style="align-items:center"><h2>الصفحة غير موجودة</h2><a class="btn" href="#home">العودة إلى الرئيسية</a></div>`; };

/* ---------- Shell & router ---------- */
function renderShell(){ const u=Store.me(); const extra=u?(u.role==="teacher"?[["teacher","لوحة المعلم"]]:u.role==="admin"?[["admin","الإدارة"]]:[["student","لوحتي"],["paths","مساري"],["portfolio","ملف إنجازي"]]):[];
 $("#nav").innerHTML=[...extra,...NAV].map(([h,t])=>`<a href="#${h}" data-nav="${h}">${t}</a>`).join("")+`<a href="#more" data-nav="more" id="more-link">المزيد</a>`;
 $("#acct").innerHTML=u?`<a class="iconbtn" href="#login" title="حسابي">${esc(u.name.split(" ")[0])}</a>`:`<a class="iconbtn" href="#login">دخول</a>`; }
PAGES.more=()=>{ view().innerHTML=`${head("كل صفحات المنصة","")}<div class="grid g4">${[["home","الصفحة الرئيسية"],["about","عن المبادرة"],["login","الدخول وإنشاء حساب"],["student","لوحة الطالب"],["teacher","لوحة المعلم"],["classes","الفصول الافتراضية"],["curriculum","خريطة المنهج"],["matrix","مصفوفة المنهج"],["unit-1","صفحة الفصل الدراسي"],["lesson-2-3","الدرس التفاعلي (النموذجي)"],["labs","المختبر الافتراضي"],["companion","رفيقة الكيمياء"],["challenges","التحديات"],["paths","مسارات الإتقان"],["incubator","حاضنة الابتكار"],["portfolio","ملف الإنجاز"],["tests","الاختبارات"],["bank","بنك الأسئلة"],["impact","التقارير وقياس الأثر"],["library","المكتبة العلمية"],["admin","إدارة المنصة"],["help","المساعدة والدعم"],["initiative","ملف المبادرة"]].map(([h,t])=>`<a class="card" href="#${h}" style="text-decoration:none;color:inherit"><b>${t}</b></a>`).join("")}</div>`; };
PAGES.classes=()=>{ const u=Store.me(); if(u?.role==="teacher") return PAGES.teacher(); if(u?.role==="student") return PAGES.student(); view().innerHTML=`${head("الفصول الافتراضية","ينشئ المعلم فصلًا ويصدر رمز انضمام من ست خانات، وينضم الطالب بالرمز. بيانات كل فصل معزولة عن غيره.")}<div class="grid g2"><div class="card"><h3>أنا معلم</h3><a class="btn" href="#login">أنشئ حسابًا ثم فصلًا</a></div><div class="card"><h3>أنا طالب</h3><a class="btn" href="#login">أنشئ حسابًا وأدخل الرمز</a></div></div>`; };
async function route(){ const h=(location.hash||"#home").slice(1); let m;
 if(Store.needsSync()){ try{ await Store.sync(); }catch(e){ toast("تعذر تحديث البيانات من الخادم: "+e.message); } renderShell(); }
 window.scrollTo(0,0); $("#nav").classList.remove("open");
 $$("[data-nav]").forEach(a=>a.classList.toggle("on",h===a.dataset.nav||h.startsWith(a.dataset.nav+"-")));
 try{
  if((m=h.match(/^lesson-(\d-\d)(?:-(\w+))?$/))) PAGES.lesson(m[1],m[2]);
  else if((m=h.match(/^unit-(\d)$/))) PAGES.unit(m[1]);
  else if((m=h.match(/^lab-(\w+)$/))) PAGES.lab(m[1]);
  else if((m=h.match(/^class-(.+)$/))) PAGES.class(m[1]);
  else if((m=h.match(/^review-(.+)$/))) PAGES.review(m[1]);
  else if((m=h.match(/^paths-(\d-\d)$/))) PAGES.paths(m[1]);
  else if((m=h.match(/^test-(.+)$/))) PAGES.test(m[1]);
  else (PAGES[h]||PAGES.notfound)();
 }catch(e){ console.error(e); view().innerHTML=`<div class="fb bad">حدث خطأ أثناء عرض الصفحة: ${esc(e.message)}</div>`; }
 const t=$("h1",view()); document.title=(t?t.textContent.trim()+" · ":"")+"كيمياء بذكاء"; $("#view").focus({preventScroll:true}); }
async function boot(){ initRemote(); if(Remote.on){ view().innerHTML=`<div class="empty">جارٍ الاتصال بقاعدة البيانات…</div>`; await Store.init(); } renderShell(); window.addEventListener("hashchange",route); route();
 window.addEventListener("cs-sync-error",e=>{ toast("لم يُحفظ آخر تغيير على الخادم: "+e.detail); setTimeout(()=>{ renderShell(); route(); },600); });
 window.addEventListener("focus",()=>{ if(Store.needsSync()) Store.sync().then(()=>{ renderShell(); }).catch(()=>{}); });
 if(Remote.error&&!Remote.on) toast(Remote.error);
 $("#menu").onclick=()=>{ const n=$("#nav"); n.classList.toggle("open"); $("#menu").setAttribute("aria-expanded",n.classList.contains("open")); };
 const root=document.documentElement; let th=null; try{ th=localStorage.getItem("chemsmart3.theme"); }catch(e){} if(th) root.setAttribute("data-theme",th);
 $("#theme").onclick=()=>{ const dark=root.getAttribute("data-theme")==="dark"||(!root.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme: dark)").matches); const n=dark?"light":"dark"; root.setAttribute("data-theme",n); try{ localStorage.setItem("chemsmart3.theme",n); }catch(e){} };
 let bd=false; try{ bd=localStorage.getItem("chemsmart3.board")==="1"; }catch(e){} document.body.classList.toggle("board",bd);
 $("#board").onclick=()=>{ const on=!document.body.classList.contains("board"); document.body.classList.toggle("board",on); $("#board").setAttribute("aria-pressed",on); try{ localStorage.setItem("chemsmart3.board",on?"1":"0"); }catch(e){} };
 if(Store.isMemoryOnly()) toast("التخزين في المتصفح غير متاح؛ ستُفقد البيانات عند إغلاق الصفحة."); }

boot();
</script>
</body></html>
